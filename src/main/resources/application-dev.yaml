server:
  port: 8081
spring:
  application:
    name: lovable
  datasource:
    url: jdbc:postgresql://localhost:5432/lovable
    username: postgres
    password: waris1918
    driver-class-name: org.postgresql.Driver
# 1. Expose the Prometheus endpoint over the web
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
#  server:
#    port: 8080
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true


