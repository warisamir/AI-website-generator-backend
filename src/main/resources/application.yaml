server:
  port: 8080  # CHANGE: Client on 8080, Admin on 8081

spring:
  application:
    name: lovable
  datasource:
    url: jdbc:postgresql://localhost:5432/lovable
    username: postgres
    password: waris1918
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,*  # Include all + your specifics
    endpoint:
      health:
        show-details: always
  metrics:
    export:
      prometheus:
        enabled: true


client-url: http://localhost:8080  # Matches new client port

logging:
  level:
    org.springframework.ai.chat.client: DEBUG
    de.codecentric.boot.admin.client: DEBUG  # ADD: Client registration logs

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects
